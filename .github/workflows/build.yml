
name: Build VinylFinder for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VinylFinder main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VinylFinder-Windows-x64
          path: dist/VinylFinder.exe
          if-no-files-found: error
          retention-days: 30
